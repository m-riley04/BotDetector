name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or PR supersedes the running check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs of releases at least a week old, matching `minimumReleaseAge` in pnpm-workspace.yaml
jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm (from `packageManager`), Node.js (from .nvmrc), then runs `pnpm install`.
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload extension build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: botdetector-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
